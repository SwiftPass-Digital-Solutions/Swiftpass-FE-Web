<div class="flex h-screen">
    <!-- Backdrop for mobile -->
    @if (isSidebarOpen()) {
        <div (click)="toggleSidebar()" class="fixed inset-0 bg-black bg-opacity-50 z-10 lg:hidden"></div>
    }

    <!-- Sidebar -->
    <aside 
        class="w-64 lg:w-[310px] fixed lg:relative top-0 left-0 h-full z-20 transform transition-transform duration-300 ease-in-out"
        [ngClass]="{
            '-translate-x-full': !isSidebarOpen(),
            'translate-x-0': isSidebarOpen()
        }"
        [class.lg:translate-x-0]="true"
        [class.lg:block]="true"
        [class.hidden]="!isSidebarOpen()"
    >
        <app-sidebar />
    </aside>

    <!-- Main Content -->
    <main class="flex-1 p-6">
        <header class="mb-2">
            <button class="lg:hidden" (click)="toggleSidebar()">
                <!-- Hamburger Icon -->
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path></svg>
            </button>
        </header>
        <ng-content></ng-content>
    </main>
</div>
